[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oif-systems-intelligence"
version = "0.1.0"
description = "Offline system inventory validation and software change analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
oif-system-diff = "oif_systems.inventory:main"

[tool.setuptools.packages.find]
where = ["src"]
